<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555" />
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="560" fill="#ffffff" />

  <text x="480" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">Hermes Agent — cost-driven AWS architecture</text>

  <!-- VPC box -->
  <rect x="30" y="60" width="480" height="430" rx="8" fill="#f3f6fb" stroke="#9db3d1" stroke-width="1.5" />
  <text x="46" y="82" font-size="13" font-weight="bold" fill="#33507a">VPC — us-east-1 (public subnets, no NAT)</text>

  <!-- Internet Gateway -->
  <rect x="200" y="98" width="140" height="40" rx="6" fill="#ffffff" stroke="#33507a" stroke-width="1.5" />
  <text x="270" y="123" text-anchor="middle" font-size="12" fill="#222">Internet Gateway</text>

  <!-- Security Group note -->
  <rect x="60" y="170" width="200" height="66" rx="6" fill="#fff7e6" stroke="#c99a2e" stroke-width="1.2" />
  <text x="70" y="188" font-size="11.5" font-weight="bold" fill="#7a5a12">Task security group</text>
  <text x="70" y="205" font-size="11" fill="#4a3a10">inbound: none</text>
  <text x="70" y="220" font-size="11" fill="#4a3a10">egress: 443 / 993 / 587 / 2049</text>

  <!-- ECS Fargate task -->
  <rect x="290" y="170" width="190" height="150" rx="8" fill="#eaf3ea" stroke="#4a8a4a" stroke-width="1.5" />
  <text x="385" y="192" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2d5c2d">ECS Fargate task</text>
  <text x="385" y="209" text-anchor="middle" font-size="10.5" fill="#2d5c2d">public subnet, assigned public IP</text>
  <rect x="310" y="222" width="150" height="60" rx="6" fill="#ffffff" stroke="#4a8a4a" stroke-width="1.2" />
  <text x="385" y="245" text-anchor="middle" font-size="11" fill="#222">Hermes Agent</text>
  <text x="385" y="260" text-anchor="middle" font-size="10" fill="#555">container (root at boot,</text>
  <text x="385" y="273" text-anchor="middle" font-size="10" fill="#555">UID 10000 at runtime)</text>
  <text x="385" y="300" text-anchor="middle" font-size="10.5" fill="#2d5c2d">scheduled scale 0 ↔ 1</text>
  <text x="385" y="314" text-anchor="middle" font-size="10.5" fill="#2d5c2d">(~4×/day wake windows)</text>

  <!-- EFS -->
  <rect x="70" y="360" width="410" height="110" rx="8" fill="#f2ecf9" stroke="#7a55b0" stroke-width="1.5" />
  <text x="86" y="382" font-size="12.5" font-weight="bold" fill="#4d3378">EFS</text>
  <rect x="90" y="394" width="170" height="58" rx="6" fill="#ffffff" stroke="#7a55b0" stroke-width="1.2" />
  <text x="175" y="415" text-anchor="middle" font-size="11" fill="#222">hermes-home</text>
  <text x="175" y="430" text-anchor="middle" font-size="10" fill="#555">MEMORY.md / USER.md</text>
  <text x="175" y="443" text-anchor="middle" font-size="10" fill="#555">access point, UID 10000</text>
  <rect x="280" y="394" width="180" height="58" rx="6" fill="#ffffff" stroke="#7a55b0" stroke-width="1.2" />
  <text x="370" y="415" text-anchor="middle" font-size="11" fill="#222">obsidian-vault</text>
  <text x="370" y="430" text-anchor="middle" font-size="10" fill="#555">recipes / research notes</text>
  <text x="370" y="443" text-anchor="middle" font-size="10" fill="#555">access point, UID 10000</text>

  <!-- Fargate to EFS -->
  <line x1="360" y1="320" x2="270" y2="360" stroke="#555" stroke-width="1.3" marker-end="url(#arrow)" />
  <text x="245" y="345" font-size="9.5" fill="#555">NFS :2049</text>

  <!-- IGW to Fargate -->
  <line x1="290" y1="138" x2="300" y2="170" stroke="#555" stroke-width="1.3" />

  <!-- No NAT / no ALB note -->
  <rect x="60" y="250" width="200" height="50" rx="6" fill="#fdeceb" stroke="#c0504d" stroke-width="1.2" stroke-dasharray="4 3" />
  <text x="160" y="270" text-anchor="middle" font-size="11" font-weight="bold" fill="#8f2f2c">intentionally absent</text>
  <text x="160" y="286" text-anchor="middle" font-size="10.5" fill="#8f2f2c">no NAT Gateway · no ALB</text>

  <!-- External services -->
  <rect x="580" y="130" width="330" height="70" rx="8" fill="#eaf1fb" stroke="#33507a" stroke-width="1.5" />
  <text x="745" y="153" text-anchor="middle" font-size="12" font-weight="bold" fill="#33507a">AWS Bedrock</text>
  <text x="745" y="170" text-anchor="middle" font-size="10.5" fill="#333">Claude Sonnet, cross-region profile</text>
  <text x="745" y="185" text-anchor="middle" font-size="10" fill="#666">boto3 credential chain (IAM task role)</text>

  <rect x="580" y="220" width="330" height="70" rx="8" fill="#eaf1fb" stroke="#33507a" stroke-width="1.5" />
  <text x="745" y="243" text-anchor="middle" font-size="12" font-weight="bold" fill="#33507a">Gmail — IMAP / SMTP</text>
  <text x="745" y="260" text-anchor="middle" font-size="10.5" fill="#333">outbound polling, not inbound webhook</text>
  <text x="745" y="275" text-anchor="middle" font-size="10" fill="#666">allowlisted senders only</text>

  <rect x="580" y="310" width="330" height="70" rx="8" fill="#eaf1fb" stroke="#33507a" stroke-width="1.5" />
  <text x="745" y="333" text-anchor="middle" font-size="12" font-weight="bold" fill="#33507a">Firecrawl</text>
  <text x="745" y="350" text-anchor="middle" font-size="10.5" fill="#333">web search / extract tool</text>
  <text x="745" y="365" text-anchor="middle" font-size="10" fill="#666">outbound HTTPS only</text>

  <!-- Fargate to external, all via IGW -->
  <line x1="480" y1="200" x2="580" y2="165" stroke="#555" stroke-width="1.3" marker-end="url(#arrow)" />
  <text x="490" y="185" font-size="9.5" fill="#555">443</text>

  <line x1="480" y1="230" x2="580" y2="255" stroke="#555" stroke-width="1.3" marker-end="url(#arrow)" />
  <text x="490" y="250" font-size="9.5" fill="#555">993 / 587</text>

  <line x1="480" y1="260" x2="580" y2="345" stroke="#555" stroke-width="1.3" marker-end="url(#arrow)" />
  <text x="490" y="305" font-size="9.5" fill="#555">443</text>

  <text x="480" y="520" text-anchor="middle" font-size="10.5" fill="#777">All external traffic is outbound-initiated from the task — no ingress rule exists on the security group.</text>
</svg>
